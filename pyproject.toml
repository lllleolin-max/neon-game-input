[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neon-game-input"
version = "0.1.0"
description = "Pupil Labs Neon screen gaze, dwell interaction, and playable examples"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt", "THIRD_PARTY.md"]
authors = [{name = "Neon Game Input contributors"}]
dependencies = []
keywords = ["neon", "eye-tracking", "gaze", "pygame", "accessibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
neon = ["pupil-labs-realtime-api==1.9.0", "real-time-screen-gaze==1.1.2"]
demo = ["pygame-ce==2.5.8"]
browser = ["aiohttp==3.14.5"]
dev = ["build>=1.2,<2"]

[project.scripts]
neon-game = "neon_game_input.demo:main"
neon-game-web = "neon_game_input.web:main"
neon-game-check = "neon_game_input.diagnose:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neon_game_input = ["assets/*.png", "browser/*.html", "browser/*.mjs", "browser/*.css", "py.typed"]
