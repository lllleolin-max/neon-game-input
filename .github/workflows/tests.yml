name: tests
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[demo,browser,dev]"
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/browser.test.mjs
      - run: python -m build
      - run: python -m neon_game_input.demo --frames 3
        env:
          SDL_VIDEODRIVER: dummy
  official-mapper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[neon]"
      - run: python -m unittest discover -s tests -p test_official_mapper.py -v
